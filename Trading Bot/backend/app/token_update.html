<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Dhan token</title>
<style nonce="{{nonce}}">:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#e9eef7;font:16px system-ui;padding:24px}main{max-width:480px;margin:8vh auto;padding:28px;border:1px solid #35415b;border-radius:16px;background:#141d2d}h1{font-size:24px}p{color:#b8c5d9;line-height:1.6}label{display:block;margin:24px 0 10px}input,button{width:100%;min-height:48px;border-radius:8px;font:inherit}input{padding:12px;background:#0b1019;color:#fff;border:1px solid #63738e}button{margin-top:18px;background:#6054d9;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}#status{overflow-wrap:anywhere}a{color:#b8b0ff}</style></head>
<body><main><h1>Update Dhan token</h1><p>Paste a token you generated in Dhan. Save verifies it and replaces only DHAN_ACCESS_TOKEN in your project .env. Automatic renewal stays off.</p>
<form id="form"><label for="token">New access token</label><input id="token" name="token" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="4096"><button id="save" type="submit">Verify and save token</button></form><p id="status" role="status" aria-live="polite"></p></main>
<script nonce="{{nonce}}">const form=document.getElementById('form'),input=document.getElementById('token'),button=document.getElementById('save'),status=document.getElementById('status');window.addEventListener('pagehide',()=>{input.value='';});form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.textContent='Verifying with Dhan…';let token=input.value;input.value='';try{const response=await fetch('/api/credentials/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),cache:'no-store',signal:AbortSignal.timeout(25000)});token='';const result=await response.json();status.textContent=response.ok?result.message:(result.detail||'Update failed.');}catch{status.textContent='Connection interrupted. The update may have completed; check bot status before retrying.';}finally{token='';button.disabled=false;}});</script></body></html>
